interface:
  display_name: "Code Review Fix Loop"
  short_description: "首次全量、修复后 focused 的本地 review 修复闭环"
  default_prompt: "使用 $code-review-fix-loop 处理当前本地 review findings：没有现成 finding 时先做一次只读全量 review，按当前代码事实核对 finding，合并同根因修复，修复后只做 focused review；验证服从仓库规则与 test_mode，deep 每批运行直接相关测试并在 review 收敛后执行一次完整本地验证矩阵；低频等待 reviewer，最多执行 5 个修复批次，并报告 review 覆盖、验证状态、阻塞与未验证边界。"
